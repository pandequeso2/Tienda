name: CI - Test y Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Tests - ${{ matrix.servicio }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - servicio: Usuario
            carpeta: Backend/Usuario
            db_name: usuario_service_db
          - servicio: Empleados
            carpeta: Backend/Empleados
            db_name: empleado_service_db
          - servicio: Productos
            carpeta: Backend/Productos
            db_name: producto_service_db
          - servicio: Sede
            carpeta: Backend/Sede
            db_name: sede_service_db

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ${{ matrix.db_name }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests
        working-directory: ${{ matrix.carpeta }}
        env:
          DB_NAME: ${{ matrix.db_name }}
          DB_USER: root
          DB_PASSWORD: ""
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          SECRET_KEY: clave-temporal-solo-para-ci
        run: python manage.py test

  build-docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imágenes del backend
        run: docker compose build usuarios empleados productos sedes gateway

      - name: Construir imágenes del frontend
        run: docker compose build frontend-home frontend-productos frontend-empleados frontend-sedes frontend-usuarios